<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutEsport Wallpapers</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 30px 6%;
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      color: #999;
      margin-top: 8px;
    }

    .categories {
      padding: 25px 6%;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .categories button {
      background: #18181f;
      color: white;
      border: 1px solid #333;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    .wallpapers {
      padding: 10px 6% 50px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #15151b;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #25252d;
    }

    .preview {
      height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111, #5b1010);
      font-size: 28px;
      font-weight: bold;
    }

    .info {
      padding: 15px;
    }

    .info h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .download {
      display: inline-block;
      background: #e63946;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>FutEsport Wallpapers</h1>
    <p>PC ve telefonlar için e-spor duvar kağıtları</p>
  </header>

  <div class="categories">
    <button>Hepsi</button>
    <button>Valorant</button>
    <button>PC</button>
    <button>Telefon</button>
    <button>4K</button>
  </div>

  <main class="wallpapers">

    <div class="card">
      <div class="preview">VALORANT</div>
      <div class="info">
        <h2>Valorant Wallpaper</h2>
        <a class="download" href="#">İndir</a>
      </div>
    </div>

    <div class="card">
      <div class="preview">ESPORT</div>
      <div class="info">
        <h2>Esport Wallpaper</h2>
        <a class="download" href="#">İndir</a>
      </div>
    </div>

  </main>

  <footer>
    © 2026 FutEsport Wallpapers
  </footer>

</body>
</html>
