 <!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fut Wallpapers</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 30px 6%;
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      color: #999;
      margin-top: 8px;
    }

    .categories {
      padding: 25px 6%;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .categories button {
      background: #18181f;
      color: white;
      border: 1px solid #333;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    .wallpapers {
      padding: 10px 6% 50px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #15151b;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #25252d;
    }

    .preview {
      height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111, #5b1010);
      font-size: 28px;
      font-weight: bold;
    }

    .info {
      padding: 15px;
    }

    .info h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .download {
      display: inline-block;
      background: #e63946;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>Fut Wallpapers</h1>
    <p>PC ve telefonlar için e-spor duvar kağıtları</p>
  </header>

  <div class="categories">
    <button>Hepsi</button>
    <button>Valorant</button>
    <button>PC</button>
    <button>Telefon</button>
    <button>4K</button>
  </div>

  <main class="wallpapers">
<div class="card">
 <img src="file_00000000b1c881f48a3b8f35ee95065a.png" alt="Fut 
Wallpaper" style="width:100%; height:350px;
object-fit:cover;">
 <div class="info">
   <h2>Fut Wallpaper</h2>
 <a class="download"
  href="file_00000000b1c881f48a3b8f35ee95065a.png" download>İndir</a>
</div>
</div>

    <div class="card">
      <img 
      src="file_00000000b5b081f4a61801debed1c269.png" alt="Valorant Wallpaper">  
      <div class="info">
        <h2>Fut Wallpaper</h2>
        <a class="download" href="file_00000000b5b081f4a61801debed1c269.png">İndir</a>
      </div>
    </div>

    <div class="card">
      <div class="preview">ESPORT</div>
      <div class="info">
        <h2>Fut Wallpaper</h2>
        <a class="download"
        href="file_00000000b5b081f4a61801debed1c269.png"
        download>İndir</a>
      </div>
    </div>

  </main>

  <footer>
    © 2026 FutEsport Wallpapers
  </footer>
<script>
document.querySelectorAll('.download').forEach(link => {
  link.addEventListener('click', async function(e) {
    e.preventDefault();

    const response = await fetch(this.href);
    const blob = await response.blob();

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'valorant-wallpaper.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
});
</script>
</body>
</html>
